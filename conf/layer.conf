# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend ${LAYERDIR}/images/*.bb"

BBFILE_COLLECTIONS += "meta-moddevices-contrib"
BBFILE_PATTERN_meta-moddevices-contrib := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-moddevices-contrib = "9"

LAYERDEPENDS_meta-moddevices-contrib = " \
    core \
    openembedded-layer \
"
# virtualization-layer dropped: only needed by the moddevices-container-* image
# recipes (recipes-samples/images/), which we're not building. Do not build
# those recipes without re-adding meta-virtualization.

LAYERSERIES_COMPAT_meta-moddevices-contrib = "wrynose"

# HOSTTOOLS += " 7z msgfmt intltool-merge python"
# Commented out entirely for now to get past `bitbake -p`. NOTE: WAF_PYTHON =
# "python" is real in mod-mda-lv2, fomp, cc-master, lvtk — building any of
# those will fail without a `python` binary on PATH (e.g. python-is-python3).

# moddevices-container-base.bb/-ampsim.bb require recipes-extended/images/
# container-base.bb, which only exists in meta-virtualization. Gated behind
# dynamic-layers so they're simply absent (not a parse error) when
# meta-virtualization isn't in BBLAYERS, same pattern meta-freescale uses.
BBFILES_DYNAMIC += " \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/*/*/*.bb \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/*/*/*.bbappend \
"

PREFERRED_VERSION_fluidsynth ?= "1.1.6"
PREFERRED_VERSION_python3-tornado ?= "4.5.2"
PREFERRED_VERSION_jack-server ?= "1.9.18"

LV2_DIR ?= "/usr/lib/lv2"
LV2_DIR_BAD ?= "/usr/lib/lv2-bad"
